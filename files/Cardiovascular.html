:root{--bg:#0B1026;--panel:#121A3A;--card:#18224A;--line:#2A3870;--ink:#F3F1EA;--soft:#BFC6E6;--cy:#35E0FF;--or:#FFB347;--gr:#34d399;--ro:#fb7185;--red:#e5484d;--blue:#4c7bf0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:440px 1fr}
#side{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 22px;gap:12px;overflow:hidden}
.kick{font-size:14px;font-weight:700;color:var(--cy)}
h1{font-size:26px;font-weight:900;line-height:1.35}
h1 span{color:var(--or)}
.info{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;min-height:170px;transition:border-color .3s}
.info.sel{border-color:var(--cy)}
.info .n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--cy);color:var(--bg);font-weight:900;font-size:17px;margin-inline-end:8px}
.info h2{font-size:21px;font-weight:800;display:flex;align-items:center;margin-bottom:2px}
.info .en{font-size:13px;color:var(--soft);direction:ltr;text-align:right;margin-bottom:6px}
.info p{font-size:16.5px;line-height:1.75;color:var(--soft)}
.info .eng{margin-top:6px;font-size:15px;color:var(--gr);font-weight:700}
.info .ai{margin-top:6px;font-size:15px;color:var(--or);font-weight:700}
.lbl{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--ro);direction:ltr}
.btns{display:flex;gap:7px}
.b{flex:1;padding:9px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:800;white-space:nowrap;transition:.2s}
.b:hover{border-color:var(--cy)}
.b.on{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.b.pri{background:var(--or);color:#1A1408;border-color:var(--or)}
.b.warn.on{background:var(--ro);border-color:var(--ro);color:#2a0710}
.parts{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px}
.pt{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid transparent;font-size:14.5px;font-weight:700;text-align:right}
.pt:hover{border-color:var(--line)}
.pt.on{border-color:var(--cy);background:rgba(53,224,255,.1)}
.pt b{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;background:var(--line);flex:none}
.pt.on b{background:var(--cy);color:var(--bg)}
#view{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1d2752 0%,#0B1026 72%)}
#tabs{position:absolute;top:14px;left:50%;translate:-50% 0;display:flex;gap:6px;background:rgba(18,26,58,.9);border:1px solid var(--line);border-radius:14px;padding:5px;z-index:5}
.tab{padding:8px 18px;border-radius:10px;font-size:15px;font-weight:800;color:var(--soft)}
.tab.on{background:var(--or);color:#1A1408}
svg.scene{position:absolute;left:0;right:0;top:56px;bottom:194px;width:100%;height:calc(100% - 250px);display:none}
svg.scene.on{display:block}
.part{cursor:pointer;transition:opacity .3s,filter .3s}
.dim .part{opacity:.18}
.dim .part.sel{opacity:1;filter:drop-shadow(0 0 10px #35E0FF)}
.lab{font-size:15px;font-weight:800;fill:#F3F1EA;paint-order:stroke;stroke:#0B1026;stroke-width:4px;pointer-events:none}
.lab.s{font-size:13px;font-weight:700;fill:#BFC6E6}
#ecg{position:absolute;left:16px;right:16px;bottom:14px;height:170px;background:rgba(10,16,40,.92);border:1px solid var(--line);border-radius:16px;padding:8px 14px;display:grid;grid-template-columns:270px 1fr;grid-template-rows:100%;gap:14px;overflow:hidden}
#ecg canvas{width:100%;height:100%;display:block;min-height:0;border-radius:10px}
.stats{display:flex;flex-direction:column;gap:2px;justify-content:center;font-size:13px;color:var(--soft);font-weight:700}
.stats b{font-size:19px;color:var(--ink)}
.stats .hr b{color:var(--ro)}
#aibox{font-size:13px;font-weight:800;padding:4px 8px;line-height:1.5;border-radius:10px;background:rgba(255,179,71,.12);border:1px solid rgba(255,179,71,.45);color:var(--or);display:none}
#aibox.on{display:block}
#aibox.bad{background:rgba(251,113,133,.14);border-color:var(--ro);color:#fecdd3}

 </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const PCIRC=[
 {id:'heartc',n:'القلب',en:'Heart',d:'مضخة عضلية بحجم قبضة اليد، فيها أربع حجرات. الجانب الأيمن يضخ للرئتين، والأيسر يضخ لكل الجسم. ينبض بحدود 100 ألف مرة باليوم.',eng:'هندسياً: مضختان على التوالي داخل عضلة وحدة.'},
 {id:'lungs',n:'الرئتان',en:'Lungs',d:'هنا يتحول الدم من أزرق إلى أحمر: يطلق ثاني أوكسيد الكربون ويأخذ الأكسجين من الهواء عبر الحويصلات الهوائية.'},
 {id:'arteries',n:'الشرايين',en:'Arteries',d:'تحمل الدم من القلب. جدرانها سميكة ومرنة حتى تتحمل الضغط العالي. الأبهر أكبرها بقطر يقارب 2.5 سم.',eng:'مرونتها تعمل مثل مُراكِم يخفّف نبضات الضغط.'},
 {id:'veins',n:'الأوردة',en:'Veins',d:'ترجّع الدم للقلب بضغط منخفض. فيها صمامات تمنع رجوع الدم للخلف، خصوصاً بالساقين.'},
 {id:'caps',n:'الشعيرات الدموية',en:'Capillaries',d:'أدق الأوعية، جدارها خلية واحدة فقط. هنا يصير تبادل الأكسجين والغذاء والفضلات بين الدم والخلايا.'},
 {id:'body',n:'أعضاء الجسم',en:'Systemic organs',d:'كل خلية بالجسم تاخذ أكسجين وغذاء من الدم، وتعطيه ثاني أوكسيد الكربون والفضلات، فيرجع الدم أزرق للقلب.'}
];
const PHEART=[
 {id:'ra',n:'الأذين الأيمن',en:'Right atrium',d:'يستقبل الدم غير المؤكسج من الجسم عبر الوريدين الأجوفين، ويدفعه للبطين الأيمن.'},
 {id:'rv',n:'البطين الأيمن',en:'Right ventricle',d:'يضخ الدم إلى الرئتين بضغط منخفض نسبياً، بحدود 25 ملم زئبق.'},
 {id:'la',n:'الأذين الأيسر',en:'Left atrium',d:'يستقبل الدم المؤكسج القادم من الرئتين عبر الأوردة الرئوية.'},
 {id:'lv',n:'البطين الأيسر',en:'Left ventricle',d:'أقوى حجرة بالقلب، جداره أسمك بكثير من الأيمن لأنه يضخ لكل الجسم بضغط بحدود 120 ملم زئبق.',eng:'مثل مضخة ضغط عالٍ، بينما الأيمن مضخة ضغط منخفض.'},
 {id:'tv',n:'الصمام ثلاثي الشرفات',en:'Tricuspid valve',d:'بين الأذين والبطين الأيمنين. يفتح لما يمتلئ البطين، وينغلق لما ينقبض حتى ما يرجع الدم.',eng:'صمام لا رجعي (check valve) مثل صمامات المضخات.'},
 {id:'pvv',n:'الصمام الرئوي',en:'Pulmonary valve',d:'عند مخرج البطين الأيمن. يفتح وقت الانقباض فيمر الدم للشريان الرئوي، وينغلق بعده.'},
 {id:'mv',n:'الصمام التاجي',en:'Mitral valve',d:'بين الأذين والبطين الأيسرين، وإله شرفتين. إغلاقه مع ثلاثي الشرفات يعطي صوت القلب الأول «لَب».'},
 {id:'av',n:'الصمام الأبهري',en:'Aortic valve',d:'عند مخرج البطين الأيسر. إغلاقه مع الرئوي يعطي صوت القلب الثاني «دَب».'},
 {id:'ao',n:'الأبهر',en:'Aorta',d:'أكبر شريان بالجسم، يطلع من البطين الأيسر ويوزّع الدم المؤكسج للجسم كله. ضغطه الطبيعي بحدود 120/80.'},
 {id:'pa',n:'الشريان الرئوي',en:'Pulmonary artery',d:'الشريان الوحيد اللي ينقل دم غير مؤكسج، من البطين الأيمن إلى الرئتين.'},
 {id:'pv',n:'الأوردة الرئوية',en:'Pulmonary veins',d:'الأوردة الوحيدة اللي تنقل دم مؤكسج، من الرئتين إلى الأذين الأيسر.'},
 {id:'vc',n:'الوريدان الأجوفان',en:'Venae cavae',d:'العلوي يجيب الدم من الرأس والذراعين، والسفلي من باقي الجسم، والاثنين يصبّون بالأذين الأيمن.'},
 {id:'cond',n:'نظام التوصيل الكهربائي',en:'SA node · AV node · His–Purkinje',d:'العقدة الجيبية الأذينية تولّد الشرارة فتنقبض الأذينات. العقدة الأذينية البطينية تأخّرها جزء من الثانية، وبعدها حزمة هِس وألياف بركنجي توزّعها على البطينين.',eng:'هي المنظّم الطبيعي، والجهاز المنظّم الصناعي (Pacemaker) يقلّدها.',ai:'تخطيط القلب ECG هو تسجيل لهاي الإشارة الكهربائية.'}
];
let view='circ',sel=null,ti=-1;
const PARTS=()=>view==='circ'?PCIRC:PHEART;
function renderParts(){$('parts').innerHTML=PARTS().map((p,i)=>`<button class="pt" data-id="${p.id}"><b>${i+1}</b>${p.n}</button>`).join('');document.querySelectorAll('.pt').forEach(b=>b.onclick=()=>select(sel===b.dataset.id?null:b.dataset.id))}
function select(id){sel=id;const sv=$(view);sv.classList.toggle('dim',!!id);sv.querySelectorAll('.part').forEach(g=>g.classList.toggle('sel',g.dataset.p===id));
 document.querySelectorAll('.pt').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 const box=$('info');box.classList.toggle('sel',!!id);
 if(!id){box.innerHTML=view==='circ'?'<h2>شبكة نقل لا تتوقف</h2><p>القلب يضخ نحو 5 لترات دم بالدقيقة في دورتين: صغرى للرئتين حتى يتأكسج الدم، وكبرى لكل الجسم. والدم يكمل لفة كاملة بحدود دقيقة وحدة وقت الراحة.</p><p class="ai">اضغط على أي جزء، أو انتقل إلى «القلب من الداخل».</p>':'<h2>مضخة مزدوجة بأربع حجرات</h2><p>راقب الصمامات: تنفتح وتنغلق مع كل نبضة بتوقيت مضبوط مع تخطيط القلب بالأسفل. الأزرق دم يحتاج أكسجين، والأحمر دم مؤكسج.</p><p class="ai">جرّب «تمرين رياضي» أو «رجفان أذيني».</p>';return}
 const list=PARTS(),i=list.findIndex(p=>p.id===id),p=list[i];box.innerHTML=`<h2><span class="n">${i+1}</span>${p.n}</h2><div class="en">${p.en}</div><p>${p.d}</p>${p.eng?`<p class="eng">⚙ ${p.eng}</p>`:''}${p.ai?`<p class="ai">${p.ai}</p>`:''}`}
document.querySelectorAll('svg.scene .part').forEach(g=>g.addEventListener('click',e=>{e.stopPropagation();select(sel===g.dataset.p?null:g.dataset.p)}));
document.querySelectorAll('svg.scene').forEach(s=>s.addEventListener('click',()=>select(null)));
function setView(v){view=v;ti=-1;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));document.querySelectorAll('svg.scene').forEach(s=>s.classList.toggle('on',s.id===v));renderParts();select(null);facts()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
function facts(){$('facts').innerHTML=view==='circ'?[['≈ 5 لتر','كمية الدم بالجسم'],['≈ دقيقة','لفة كاملة للدم وقت الراحة'],['≈ 100,000','نبضة باليوم'],['≈ 100,000 كم','طول الأوعية الدموية']].map(f=>`<div class="fact"><b>${f[0]}</b>${f[1]}</div>`).join(''):[['120/80','ضغط الأبهر (ملم زئبق)'],['≈ 25','ضغط البطين الأيمن'],['≈ 70 مل','دم بكل ضربة']].map(f=>`<div class="fact"><b>${f[0]}</b>${f[1]}</div>`).join('')}
$('tour').onclick=()=>{ti=(ti+1)%PARTS().length;select(PARTS()[ti].id)};$('tnext').onclick=()=>{ti=(ti+1)%PARTS().length;select(PARTS()[ti].id)};$('tprev').onclick=()=>{ti=(ti-1+PARTS().length)%PARTS().length;select(PARTS()[ti].id)};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' '){e.preventDefault();$('tnext').click()}else if(e.key==='ArrowRight'){e.preventDefault();$('tprev').click()}else if(e.key==='Escape')select(null)});

// ---------- heart rhythm ----------
let HR=72,af=false,useAI=false,paused=false,slow=false;
const setHR=v=>{HR=v;$('hr').value=v;$('hrv').textContent=v};
$('hr').oninput=e=>{setHR(+e.target.value);$('rest').classList.remove('on');$('ex').classList.remove('on')};
$('rest').onclick=()=>{setHR(72);$('rest').classList.add('on');$('ex').classList.remove('on')};
$('ex').onclick=()=>{setHR(150);$('ex').classList.add('on');$('rest').classList.remove('on')};
$('af').onclick=()=>{af=!af;$('af').classList.toggle('on',af)};
$('ai').onclick=()=>{useAI=!useAI;$('ai').classList.toggle('on',useAI);$('aibox').classList.toggle('on',useAI)};
$('pause').onclick=()=>{paused=!paused;$('pause').classList.toggle('on',paused);$('pause').textContent=paused?'تشغيل':'إيقاف'};
$('slow').onclick=()=>{slow=!slow;$('slow').classList.toggle('on',slow)};
// beat scheduler
let phase=0,beatLen=60/72,ph=0;
function nextBeat(){beatLen=60/HR;if(af)beatLen*=0.55+Math.random()*0.9}
// phase helpers (fraction of beat)
const AS=[0.02,0.16],VS=[0.2,0.5];
const inR=(x,a)=>x>=a[0]&&x<=a[1];
const sm=(x,a,b)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
function contraction(f){const a=af?0.04*Math.abs(Math.sin(performance.now()/45)):(inR(f,AS)?Math.sin((f-AS[0])/(AS[1]-AS[0])*Math.PI):0);const v=inR(f,VS)?Math.sin((f-VS[0])/(VS[1]-VS[0])*Math.PI):0;return {a,v}}
// valves
function setValve(id1,id2,hx1,hy1,hx2,hy2,open,dirDown){const L=34,ang=open?(dirDown?1.25:-1.25):0.0;
 const e1=$(id1),e2=$(id2);const cx=(hx1+hx2)/2,cy=(hy1+hy2)/2;
 const dx1=cx-hx1,dy1=cy-hy1,l1=Math.hypot(dx1,dy1),a1=Math.atan2(dy1,dx1)+(open?(dirDown?0.9:-0.9):0);
 const dx2=cx-hx2,dy2=cy-hy2,l2=Math.hypot(dx2,dy2),a2=Math.atan2(dy2,dx2)-(open?(dirDown?0.9:-0.9):0);
 e1.setAttribute('x2',hx1+Math.cos(a1)*l1);e1.setAttribute('y2',hy1+Math.sin(a1)*l1);e2.setAttribute('x2',hx2+Math.cos(a2)*l2);e2.setAttribute('y2',hy2+Math.sin(a2)*l2)}
// ECG
const ec=$('ecgc'),ex=ec.getContext('2d');let W=1100,H=260;function fit(){W=ec.width=Math.max(300,ec.clientWidth*devicePixelRatio|0);H=ec.height=Math.max(80,ec.clientHeight*devicePixelRatio|0)}addEventListener('resize',fit);const ecgBuf=new Array(4000).fill(0);let ecgX=0;
function ecgVal(f){let v=0;const g=(c,w,h)=>h*Math.exp(-Math.pow((f-c)/w,2));
 if(!af)v+=g(0.08,0.035,0.12);else v+=0.03*Math.sin(f*90+performance.now()/37)+0.02*Math.sin(f*53);
 v+=g(0.19,0.008,-0.12)+g(0.205,0.011,1.0)+g(0.222,0.009,-0.25)+g(0.43,0.05,0.28);return v}
function drawECG(){const g=H/8;ex.fillStyle='#0a1028';ex.fillRect(0,0,W,H);ex.strokeStyle='rgba(251,113,133,.12)';ex.lineWidth=1;for(let x=0;x<W;x+=g){ex.beginPath();ex.moveTo(x,0);ex.lineTo(x,H);ex.stroke()}for(let y=0;y<H;y+=g){ex.beginPath();ex.moveTo(0,y);ex.lineTo(W,y);ex.stroke()}
 ex.strokeStyle='#4ade80';ex.lineWidth=2.5*devicePixelRatio;ex.lineJoin='round';ex.beginPath();for(let x=0;x<W;x++){const y=H*0.68-ecgBuf[x]*H*0.52;x?ex.lineTo(x,y):ex.moveTo(x,y)}ex.stroke();ex.fillStyle='#0a1028';ex.fillRect(ecgX,0,24*devicePixelRatio,H);
 ex.fillStyle='#BFC6E6';ex.font=`700 ${15*devicePixelRatio}px Cairo, sans-serif`;ex.textAlign='left';ex.fillText('ECG · تخطيط القلب',10*devicePixelRatio,22*devicePixelRatio)}
// particles
function mkDots(gid,paths,n,col){const g=$(gid);const arr=[];paths.forEach(p=>{const el=$(p.id);const L=el.getTotalLength();for(let k=0;k<n;k++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',p.r||6);c.setAttribute('fill',col(p,0));g.appendChild(c);arr.push({el,L,u:k/n,c,p})}});return arr}
// heart flow gates: fraction along path where valves are
const hPaths=[{id:'fR1',side:'R',av:0.30,sl:0.56},{id:'fR2',side:'R',av:0.40,sl:0.62},{id:'fL1',side:'L',av:0.22,sl:0.56},{id:'fL2',side:'L',av:0.20,sl:0.55}];
const hDots=mkDots('hDots',hPaths,14,p=>p.side==='R'?'#9db8ff':'#ffb3b3');
// circulation loops: build closed paths by sequences
const cPaths=[{id:'cPA_L',col:'b'},{id:'cPA_R',col:'b'},{id:'cPV_L',col:'r'},{id:'cPV_R',col:'r'},{id:'cAO',col:'r'},{id:'cVC',col:'b'}];
const cDots=mkDots('cDots',cPaths.map(p=>Object.assign({r:7},p)),8,p=>p.col==='b'?'#a5c0ff':'#ffc2c2');
// conduction spark path
const his=$('his'),hisL=his.getTotalLength();
let last=performance.now(),secF=0;
function frame(now){let dt=Math.min(0.05,(now-last)/1000);last=now;if(slow)dt*=0.3;if(paused)dt=0;
 ph+=dt/beatLen;if(ph>=1){ph-=1;nextBeat()}
 const f=ph,{a,v}=contraction(f);
 // heart squeeze
 $('atria').style.transformOrigin='490px 420px';$('atria').style.transform=`scale(${1-0.07*a})`;
 $('vents').style.transformOrigin='530px 620px';$('vents').style.transform=`scale(${1-0.07*v})`;
 $('hBody').style.transformOrigin='520px 560px';$('hBody').style.transform=`scale(${1-0.025*v})`;
 $('cHeart').style.transformOrigin='500px 440px';$('cHeart').style.transform=`scale(${1+0.06*(v||a*0.5)})`;
 const avOpen=!inR(f,[0.19,0.53]),slOpen=inR(f,[0.23,0.5]);
 setValve('tv1','tv2',328,522,392,518,avOpen,true);setValve('mv1','mv2',592,452,690,454,avOpen,true);
 setValve('pv1','pv2',436,446,480,446,slOpen,false);setValve('av1','av2',506,452,550,452,slOpen,false);
 // conduction spark
 const sp=$('spark');let sx=-99,sy=-99,so=0;
 if(!af&&f<0.12){const k=f/0.12;sx=300+(420-300)*k;sy=350+(515-350)*k;so=1}else if(f>=0.18&&f<0.26){const k=(f-0.18)/0.08;const pt=his.getPointAtLength(k*hisL);sx=pt.x;sy=pt.y;so=1}
 if(af){$('san').setAttribute('fill',Math.random()<0.5?'#fde047':'#fb923c')}else $('san').setAttribute('fill',f<0.06?'#ffffff':'#fde047');
 sp.setAttribute('cx',sx);sp.setAttribute('cy',sy);sp.setAttribute('opacity',so);
 // particles (heart) gated
 hDots.forEach(d=>{const p=d.p;let nu=d.u+dt*0.11*(HR/72);
  if(!avOpen&&d.u<=p.av&&nu>p.av)nu=p.av;if(!slOpen&&d.u<=p.sl&&nu>p.sl&&d.u>p.av-0.001)nu=p.sl;
  d.u=nu%1;const pt=d.el.getPointAtLength(d.u*d.L);d.c.setAttribute('cx',pt.x);d.c.setAttribute('cy',pt.y);
  d.c.setAttribute('fill',p.side==='R'?'#9db8ff':'#ffb3b3')});
 cDots.forEach(d=>{d.u=(d.u+dt*0.16*(HR/72))%1;const pt=d.el.getPointAtLength(d.u*d.L);d.c.setAttribute('cx',pt.x);d.c.setAttribute('cy',pt.y)});
 // ECG
 const px=Math.max(1,Math.round(dt*W*0.2*(slow?3.3:1)));for(let k=0;k<px;k++){ecgX=(ecgX+1)%W;ecgBuf[ecgX]=paused?ecgBuf[ecgX]:ecgVal(f)}drawECG();
 // stats
 const effHR=af?Math.round(HR*1.0):HR;$('sHR').textContent=effHR;$('sCO').textContent=(effHR*(af?0.055:0.07)).toFixed(1);
 $('sPh').textContent=af?'الأذينان يرتجفان بدل ما ينقبضان':inR(f,[0.19,0.53])?'انقباض البطينين (لَب… الصمامات الأذينية مغلقة)':inR(f,AS)?'انقباض الأذينين':'انبساط: امتلاء البطينين';
 if(useAI){const box=$('aibox');secF+=dt;if(secF>0.5){secF=0;
   if(af){box.textContent='🤖 اشتباه رجفان أذيني: نظم غير منتظم وبدون موجة P';box.classList.add('bad')}
   else if(HR>100){box.textContent='🤖 تسرّع قلب جيبي · طبيعي أثناء التمرين';box.classList.remove('bad')}
   else if(HR<50){box.textContent='🤖 بطء قلب · يحتاج تقييم طبي';box.classList.add('bad')}
   else{box.textContent='🤖 نظم جيبي طبيعي ✓';box.classList.remove('bad')}}}
 requestAnimationFrame(frame)}
fit();renderParts();select(null);facts();nextBeat();requestAnimationFrame(frame);
})();
